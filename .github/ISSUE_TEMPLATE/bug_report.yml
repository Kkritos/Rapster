name: Bug report
description: Report a crash, incorrect result, or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / input parameters
      description: The full command line, including all arguments and the random seed if one was set.
      render: shell
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or relevant output
      render: text
  - type: input
    id: version
    attributes:
      label: Rapster version or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and NumPy/SciPy versions
